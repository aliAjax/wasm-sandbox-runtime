openapi: 3.0.3
info:
  title: WASM Sandbox Runtime API
  version: 1.0.0
servers:
  - url: http://localhost:8087
paths:
  /api/v1/modules:
    get: {summary: List modules, responses: {"200": {description: OK}}}
    post: {summary: Create module, requestBody: {required: true}, responses: {"201": {description: Created}}}
  /api/v1/modules/{id}/versions:
    post: {summary: Register signed module version, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {"201": {description: Created}}}
  /api/v1/executions:
    get: {summary: List executions, responses: {"200": {description: OK}}}
    post: {summary: Submit idempotent execution, responses: {"202": {description: Accepted}}}
  /api/v1/executions/{id}/events:
    get: {summary: Stream state events, responses: {"200": {description: SSE}}}
